version: '3.8'

services:
  # Redis service for caching and session storage
  redis:
    image: redis:7-alpine
    container_name: playwright-mcp-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    environment:
      - REDIS_APPENDONLY=yes
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - playwright-mcp-network

  # PostgreSQL service for persistent data storage
  postgres:
    image: postgres:16-alpine
    container_name: playwright-mcp-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    environment:
      POSTGRES_DB: playwright_mcp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d playwright_mcp"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - playwright-mcp-network

  # Optional: pgAdmin for database administration
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: playwright-mcp-pgadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@playwright-mcp.local
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - playwright-mcp-network
    profiles:
      - admin

  # Optional: Redis Commander for Redis administration
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: playwright-mcp-redis-commander
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - REDIS_HOSTS=local:redis:6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - playwright-mcp-network
    profiles:
      - admin

  # Optional: Playwright MCP Server (for full containerized development)
  playwright-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: playwright-mcp-server
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Database connections (using service names)
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
      - REDIS_DB=0
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=playwright_mcp
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      # Server configuration
      - MCP_SERVER_HOST=0.0.0.0
      - MCP_SERVER_PORT=3000
      - NODE_ENV=development
    volumes:
      - ./output:/app/output
      - /dev/shm:/dev/shm
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - playwright-mcp-network
    profiles:
      - full

# Named volumes for data persistence
volumes:
  redis_data:
    driver: local
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

# Custom network for service communication
networks:
  playwright-mcp-network:
    driver: bridge
